<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leetify for Codeforces</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0b1220; color: #dbe7f6; }
    body { max-width: 680px; margin: 0 auto; padding: 48px 24px; }
    h1 { color: #f5fbff; font-size: 28px; }
    p { color: #91a5c1; line-height: 1.6; }
    .card { padding: 20px; border: 1px solid #263d59; border-radius: 10px; background: #101d31; }
    code { color: #72e6b4; }
  </style>
</head>
<body>
  <h1>Leetify for Codeforces</h1>
  <div class="card">
    <p>This Firefox extension stores drafts, notes, and workspace preferences locally using <code>browser.storage.local</code>.</p>
    <p>Open any Codeforces problem page to start. Use the browser toolbar button to hide or show the workspace.</p>
  </div>
</body>
</html>
